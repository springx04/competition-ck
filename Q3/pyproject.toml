[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q3-explanations"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["q3*", "q3_align*"]

[tool.pytest.ini_options]
markers = ["integration", "alignment"]
