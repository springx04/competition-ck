experiment:
  id: q1_alignment_repair_stage2_20260926
  baseline_run: runs/q1_full_20260924
  output_run: runs/q1_alignment_repair_stage2
  source_revision: da6c8e5bd553d0480ca941384ae20f279929872f
  candidate_only: true
  production_write: false
  use_sentiment_labels: false

text_similarity:
  score: mean_token_f1_and_character_similarity
  within_video_off_diagonal_margin: 0.10
  global_top_k: 5
  semantic_strong:
    official_whisper_token_f1_min: 0.60
    official_whisper_character_similarity_min: 0.60
    true_pair_rank_max: 1
  semantic_weak:
    official_whisper_token_f1_min: 0.45
    true_pair_rank_max: 5
  conflict:
    official_asr_token_f1_max: 0.35
    ctc_whisper_token_f1_min: 0.60
    global_rank_min: 10
    top1_minus_true_margin_min: 0.15
  note: frozen_before_stage2_outputs_ctc_diagnostic_wer_is_not_a_semantic_veto

official_forced_alignment:
  implementation: whisperx_3_8_6_torchaudio
  model: WAV2VEC2_ASR_LARGE_LV60K_960H
  checkpoint: models/auto_resolution/manual_upload/wav2vec2_fairseq_large_lv60k_asr_ls960.pth
  language: en
  device: cuda
  transcript_source: official_manifest_raw_text
  run_all_samples: true

temporal_status:
  verified:
    common_coverage_min: 0.80
    midpoint_median_s_max: 0.30
    midpoint_p90_s_max: 0.60
  partial_alignment_coverage_min: 0.10
  sensitivity:
    midpoint_median_s: [0.20, 0.30, 0.40]
    midpoint_p90_s: [0.40, 0.60, 0.80]

vision:
  arcface_primary_cosine_threshold: 0.60
  arcface_sensitivity_thresholds: [0.50, 0.70]
  talknet_active_logit_threshold: 0.0
  window_s: 0.50
  stride_s: 0.25
  av_sync_role: auxiliary_only
  av_sync_support_percentile_min: 0.80
  av_sync_conflict_percentile_max: 0.20
  note: ArcFace_assigns_identity_TalkNet_assigns_active_speaker_AVsync_never_vetoes_alone

artifacts:
  word_candidate: q1_word_aligned_repair_candidate.npz
  compact50_candidate: q1_compact50_repair_candidate.npz
  overwrite_formal_outputs: false
